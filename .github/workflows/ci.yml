name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      # Installs the pinned toolchain (go, golangci-lint, deadcode) from mise.toml, then
      # runs the full gate: fmt, build, vet, lint, deadcode, test -race.
      - run: mise run check
      # Coverage: one holistic profile for the module (coverage.out).
      - run: mise run cover
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  # The example (testdata/example) is a separate module with its own dependencies. It is checked
  # but deliberately excluded from coverage, so it runs as its own job.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run example

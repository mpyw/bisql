name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      # Installs the pinned toolchain (go, golangci-lint, deadcode) from mise.toml, then
      # runs the full gate: fmt, build, vet, lint, deadcode, test -race.
      - run: mise run check

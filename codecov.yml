# Coverage is informational: it never fails CI (thresholds off), it only reports.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Per-module flags, uploaded separately by CI.
flag_management:
  individual_flags:
    - name: library
      paths:
        - "!cmd/"
    - name: cli
      paths:
        - "cmd/"

ignore:
  - "testdata"

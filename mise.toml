[tools]
"github:mpyw/declscope" = "0.13.0"
go = "1.25.3"
golangci-lint = "2.12.2"
"go:golang.org/x/tools/cmd/deadcode" = "latest"

[tasks.build]
description = "Build all packages"
run = 'go build ./...'

[tasks.fmt]
description = "Check formatting (gofmt)"
run = '''
files=$(gofmt -l .)
if [ -n "$files" ]; then echo "gofmt needed on:"; echo "$files"; exit 1; fi
'''

[tasks.vet]
description = "go vet"
run = 'go vet ./...'

[tasks.lint]
description = "golangci-lint"
run = 'golangci-lint run ./...'

[tasks.deadcode]
description = "Report unreachable functions (reachability via tests)"
run = 'deadcode -test ./...'

[tasks.test]
description = "Run tests with the race detector"
run = 'go test -race ./...'

[tasks.cover]
description = "Write a holistic coverage profile (coverage.out)"
run = 'go test -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...'

# shrink goes first: a declaration it unexports becomes private to its file's namespace, and the
# analyzer then reports every other file that uses it. Settle shrink, then the analyzer.
# GOWORK=off because shrink loads one main module, and go.work joins testdata/example as a second.
[tasks.shrink]
description = "Report exported declarations of internal/ that nothing outside their package uses"
run = 'GOWORK=off declscope shrink ./...'

[tasks.declscope]
description = "File-level scope check (github.com/mpyw/declscope)"
depends = ["shrink"]
run = 'declscope ./...'

[tasks.check]
description = "Full gate: fmt, build, vet, lint, deadcode, shrink, declscope, test"
depends = ["fmt", "build", "vet", "lint", "deadcode", "declscope", "test"]

# The example is a separate module (testdata/example, joined via go.work) with its own deps
# (modernc.org/sqlite, samber/lo). It is checked but deliberately kept out of coverage, so it
# runs as its own task/CI job rather than under `check`/`cover`. Formatting is already covered by
# the root `fmt` task (gofmt -l . recurses into testdata/example).
[tasks.example]
description = "Check the example module (build, vet, lint, deadcode, test -race); no coverage"
dir = "testdata/example"
run = 'go build ./... && go vet ./... && golangci-lint run ./... && deadcode -test ./... && go test -race ./...'
